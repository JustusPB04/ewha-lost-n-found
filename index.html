<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Login page only */
    main {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 1rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
    }

    #login-message {
      margin-top: 0.75rem;
    }

    /* Add / Search buttons, only shown after login */
    #action-buttons {
      display: none;
      margin-top: 1.5rem;
    }

    #action-buttons button {
      display: block;
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>lostnfound</h1>
    <nav>
      <div class="nav-left">
        <a href="pages/add.html">add</a>
        <a href="pages/search.html">search</a>
      </div>
      <div class="nav-right">
        <a href="#" id="logout-button">logout</a>
        <a href="pages/profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main>
    <section id="login">
      <h2>Log-in</h2>

      <section id="login-description">
        <p>Please log in with your school email and password.</p>
      </section>

      <form id="login-form">
        <div>
          <label for="email">ID (school email)</label><br>
          <input type="email" id="email" name="email" placeholder="example@ewha.ac.kr" required>
        </div>
        <br>
        <div>
          <label for="password">PASSWORD</label><br>
          <input type="password" id="password" name="password" required>
        </div>
        <br>
        <div class="form-buttons">
          <button type="submit">LOGIN</button>
          <button type="button" id="register-button">REGISTER</button>
        </div>
      </form>

      <!-- Login result message (below the SUBMIT button) -->
      <p id="login-message"></p>
      <p id="register-message"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

  <!-- Supabase JS library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  
</body>
</html>
