<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost n Found - Item Details</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        main { max-width: 37.5rem; }   /* 600px */
        .item-image {
            width: 100%;
            max-height: 21.875rem;     /* 350px */
            object-fit: contain;
            border-radius: 0.5rem;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<header>
    <h1>lostnfound</h1>

    <nav>
        <div class="nav-left">
            <a href="add.html">add</a>
            <a href="search.html">search</a>
        </div>

        <div class="nav-right">
            <a href="#" id="logout-button">logout</a>
            <a href="profile.html">mypage</a>
        </div>
    </nav>
</header>

<main class="container my-4">
    <h2 class="mb-3">Item Details</h2>

    <p id="message" class="text-muted">Loading item details...</p>

    <div id="itemContainer" style="display: none;">

        <!-- 이미지 영역 (반응형 Flex) -->
        <div id="imageContainer" class="d-flex flex-wrap gap-2 mb-3"></div>

        <!-- Bootstrap Card 컴포넌트 적용 -->
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 id="itemName" class="card-title mb-3"></h3>

                <div class="mb-3">
                    <small class="text-muted d-block">Category</small>
                    <span id="itemCategory" class="fw-medium"></span>
                </div>

                <div class="mb-3">
                    <small class="text-muted d-block">Description</small>
                    <span id="itemDescription"></span>
                </div>

                <div class="mb-3">
                    <small class="text-muted d-block">Date Found</small>
                    <span id="foundDate"></span>
                </div>

                <div class="mb-3">
                    <small class="text-muted d-block">Location Found</small>
                    <span id="foundLocation"></span>
                </div>

                <div class="mb-4">
                    <small class="text-muted d-block">Storage Location</small>
                    <span id="pickupMethod"></span>
                </div>

                <button id="foundButton" type="button" class="btn btn-dark w-100 py-2">
                    Mark as Returned
                </button>
            </div>
        </div>

    </div>
</main>

<footer class="text-center py-3 mt-5">
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase JS library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Team Supabase connection, Navigation & Item logic -->
<script src="../js/supabase.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/item.js"></script>

</body>
</html>
