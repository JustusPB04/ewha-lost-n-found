<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - Item Detail</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .item-detail-main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #555;
      text-decoration: none;
      font-size: 0.9375rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .detail-card {
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      padding: 1.25rem;
      background: #fff;
    }

    .detail-images {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      background: #f7f7f7;
      border-radius: 0.375rem;
      padding: 0.75rem;
      align-items: center;
      justify-content: center;
      min-height: 12rem;
    }

    .detail-images img {
      max-height: 22rem;
      width: auto;
      max-width: 100%;
      border-radius: 0.25rem;
      object-fit: contain;
    }

    .no-image-box {
      font-size: 3rem;
      padding: 2rem 0;
    }

    .detail-header {
      border-bottom: 1px solid #eee;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .category-badge {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.8125rem;
      font-weight: bold;
      padding: 0.2rem 0.6rem;
      border-radius: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .detail-title {
      margin: 0 0 0.375rem 0;
      font-size: 1.5rem;
    }

    .detail-created {
      margin: 0;
      font-size: 0.8125rem;
      color: #777;
    }

    .detail-meta-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1.25rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .detail-meta-list li {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .detail-meta-list strong {
      display: inline-block;
      min-width: 7.5rem;
      color: #333;
    }

    .detail-description {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 0.375rem;
      padding: 1rem;
      margin-bottom: 1.25rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .detail-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .delete-btn {
      background-color: #fff;
      color: #cc0000;
      border: 1px solid #cc0000;
      padding: 0.5rem 0.875rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .delete-btn:hover {
      background-color: #cc0000;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>lostnfound</h1>
    <nav>
      <div class="nav-left">
        <a href="add.html">add</a>
        <a href="search.html">search</a>
      </div>
      <div class="nav-right">
        <a href="#" id="logout-button">logout</a>
        <a href="profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main class="item-detail-main">
    <a href="search.html" class="back-link">&larr; Back to Search</a>

    <p id="statusMessage">Loading item details...</p>

    <article class="detail-card" id="detailCard" style="display: none;">
      <div class="detail-images" id="itemImagesContainer"></div>

      <div class="detail-header">
        <span class="category-badge" id="itemCategory">Uncategorized</span>
        <h2 class="detail-title" id="itemName"></h2>
        <p class="detail-created" id="itemCreatedAt"></p>
      </div>

      <ul class="detail-meta-list">
        <li><strong>Found Location:</strong> <span id="itemLocation">Unknown</span></li>
        <li><strong>Found Date:</strong> <span id="itemFoundDate">Unknown</span></li>
        <li><strong>Pickup Method:</strong> <span id="itemPickupMethod">Not specified</span></li>
      </ul>

      <div class="detail-description" id="itemDescription"></div>

      <div class="detail-actions" id="ownerActions" style="display: none;">
        <button type="button" class="delete-btn" id="deleteItemBtn">Delete Item</button>
      </div>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/itempage.js"></script>
</body>
</html>
