<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - Add Item</title>
  <style>
    /* nav: add, search on the left / logout, mypage on the right */
    nav { display: flex; justify-content: space-between; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <header>
    <h1>lostnfound</h1>
    <nav>
      <div>
        <a href="add.html">add</a>
        <a href="search.html">search</a>
      </div>
      <div>
        <a href="#" id="logout-button">logout</a>
        <a href="profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main>
    <h2>Add</h2>

    <form id="add-form">
      <p>
        <label for="photos">Photos</label><br>
        <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple required>
      </p>
      <p>
        <label for="name">Name</label><br>
        <input type="text" id="name" required>
      </p>
      <p>
        <label for="category">Category</label><br>
        <select id="category" required>
          <option value="">Select a category</option>
        </select>
      </p>
      <p>
        <label for="found-date">Date Found</label><br>
        <input type="date" id="found-date" required>
      </p>
      <p>
        <label for="found-location">Location Found</label><br>
        <input type="text" id="found-location" required>
      </p>
      <p>
        <label for="storage-location">Storage Location</label><br>
        <input type="text" id="storage-location" required>
      </p>
      <p>
        <label for="description">Description</label><br>
        <textarea id="description"></textarea>
      </p>
      <button type="submit">Submit</button>
    </form>

    <!-- Upload result message -->
    <p id="message"></p>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/navigation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

<script>
    const form = document.getElementById('add-form');
    const message = document.getElementById('message');
    let user = null;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    // Load categories from database
    async function loadCategories() {
        const { data, error } = await supabaseClient
            .from('categories')
            .select('id, name');

        if (error) {
            showMessage('Failed to load categories.', 'error');
            return;
        }

        const select = document.getElementById('category');

        data.forEach((category) => {
            select.innerHTML +=
                `<option value="${category.id}">${category.name}</option>`;
        });
    }

    // Initialize page after authentication check
    async function initializePage() {
        user = await requireAuthentication();

        if (!user) {
            return;
        }

        await loadCategories();
    }

    // Upload item
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage('Uploading...', '');

        const { data: item, error } = await supabaseClient
            .from('items')
            .insert({
                user_id: user.id,
                category_id: document.getElementById('category').value,
                name: document.getElementById('name').value,
                found_date: document.getElementById('found-date').value,
                found_location: document.getElementById('found-location').value,
                pickup_method: document.getElementById('storage-location').value,
                description: document.getElementById('description').value
            })
            .select('id')
            .single();

        if (error) {
            showMessage('Failed to save the item.', 'error');
            return;
        }

        const photos = document.getElementById('photos').files;

        for (let i = 0; i < photos.length; i++) {
            const compressed = await imageCompression(
                photos[i],
                { maxSizeMB: 1 }
            );

            const path = `${item.id}/image-${i + 1}-${photos[i].name}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('item-images')
                .upload(path, compressed);

            if (uploadError) {
                showMessage('Failed to upload photos.', 'error');
                return;
            }

            const { error: imageError } = await supabaseClient
                .from('item_images')
                .insert({
                    item_id: item.id,
                    storage_path: path
                });

            if (imageError) {
                showMessage('Failed to save image information.', 'error');
                return;
            }
        }

        showMessage('Item uploaded successfully!', 'success');
        form.reset();
    });

    initializePage();
</script>
</body>
</html>
