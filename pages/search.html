<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - Search</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #ccc; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    nav a { margin-right: 12px; }
    nav .nav-right a { margin-right: 0; margin-left: 12px; }
    main.search-main { max-width: 500px; margin: 0 auto; padding: 16px; }
    .search-box { display: flex; align-items: center; width: 100%; border: 1px solid #ccc; padding: 8px; margin-bottom: 12px; }
    .search-box input { width: 100%; border: none; outline: none; margin-left: 8px; }
    .filters { display: flex; gap: 8px; width: 100%; margin-bottom: 20px; }
    .filters select { flex: 1; width: 100%; padding: 8px; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .item-card { display: flex; align-items: center; width: 100%; padding: 12px; border: 1px solid #ccc; margin-bottom: 12px; text-decoration: none; color: inherit; }
    footer { text-align: center; padding: 16px; color: #666; }
  </style>
</head>
<body>

  <header>
    <h1>lostnfound</h1>
    <nav>
      <div class="nav-left">
        <a href="add.html">add</a>
        <a href="search.html">search</a>
      </div>
      <div class="nav-right">
        <a href="#" id="logout-button">logout</a>
        <a href="profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main class="search-main">
    <section class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search for an item...">
    </section>

    <section class="filters">
      <select id="locationFilter">
        <option value="">Location</option>
        <option value="Library">Library</option>
        <option value="Cafeteria">Cafeteria</option>
        <option value="Classroom">Classroom</option>
      </select>

      <select id="categoryFilter">
        <option value="">Category</option>
      </select>

      <select id="dateFilter">
        <option value="">Date</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>
    </section>

    <section class="results-header">
      <h2>Search Results (<span id="resultCount">0</span>)</h2>
      <div class="sort-box">
        <span>Sort:</span>
        <select id="sortSelect">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name">Name</option>
        </select>
      </div>
    </section>

    <section class="item-list" id="itemList"></section>

    <div class="no-results" id="noResults" style="text-align: center; color: #888; padding: 32px 0;">
      No items found.
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>

</body>
</html>
