<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - My Page</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid #ccc;
      background-color: #fff;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-right: 12px;
      text-decoration: none;
      color: #000;
    }

    nav .nav-right a {
      margin-right: 0;
      margin-left: 12px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-title {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    /* User Info Section */
    #user-info {
      background: #fff;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #user-email {
      font-weight: bold;
      color: #333;
    }

    #delete-account-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    #delete-account-btn:hover {
      background-color: #cc0000;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.2s ease;
    }

    .item-card:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .item-title {
      font-size: 1.1em;
      font-weight: bold;
      margin: 0 0 4px 0;
    }

    .item-date {
      font-size: 0.85em;
      color: #666;
      margin: 0;
    }

    .no-items-msg {
      text-align: center;
      color: #777;
      padding: 24px;
    }

    footer {
      text-align: center;
      padding: 16px;
      color: #666;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>lostnfound</h1>
    <nav>
      <div class="nav-left">
        <a href="add.html">add</a>
        <a href="search.html">search</a>
      </div>
      <div class="nav-right">
        <a href="#" id="logout-button">logout</a>
        <a href="profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main>
    <h2 class="section-title">My Page</h2>

    <section id="user-info">
      <div>
        <span>Logged in as: </span>
        <span id="user-email">Loading...</span>
      </div>
      <button id="delete-account-btn">Delete Account</button>
    </section>

    <section id="my-items-section">
      <h3 class="section-title">My Uploaded Items</h3>
      <div class="item-list" id="item-list-container">
        <p class="no-items-msg">Loading your items...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

  
<!-- Supabase JS library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Central Supabase client -->
<script src="../js/supabase.js"></script>

<!-- Authentication guard -->
<script src="../js/auth-guard.js"></script>

<!-- Navigation -->
<script src="../js/navigation.js"></script>

<script>
    const userEmailDisplay = document.getElementById('user-email');
    const deleteBtn = document.getElementById('delete-account-btn');
    const itemListContainer = document.getElementById('item-list-container');

    let currentUser = null;

    // Initialize page after authentication check
    async function initializePage() {
        currentUser = await requireAuthentication();

        if (!currentUser) {
            return;
        }

        userEmailDisplay.textContent = currentUser.email;

        await loadMyItems(currentUser.id);
    }

    // Load items uploaded by the current user
    async function loadMyItems(userId) {
        const { data: items, error } = await supabaseClient
            .from('items')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: false });

        itemListContainer.innerHTML = '';

        if (error) {
            console.error("Error fetching items:", error);
            itemListContainer.innerHTML =
                '<p class="no-items-msg" style="color:red;">Failed to load items.</p>';
            return;
        }

        if (!items || items.length === 0) {
            itemListContainer.innerHTML =
                '<p class="no-items-msg">You have not uploaded any items yet.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            card.onclick = () => {
                window.location.href = `item.html?id=${item.id}`;
            };

            const titleDateWrapper = document.createElement('div');

            const title = document.createElement('p');
            title.className = 'item-title';
            title.textContent = item.name;

            const date = document.createElement('p');
            date.className = 'item-date';
            date.textContent = new Date(item.created_at).toLocaleDateString();

            titleDateWrapper.appendChild(title);
            titleDateWrapper.appendChild(date);

            card.appendChild(titleDateWrapper);
            itemListContainer.appendChild(card);
        });
    }

    // Delete account
    deleteBtn.addEventListener('click', async () => {
        const confirmDelete = confirm(
            "Are you sure you want to delete your account? This action cannot be undone and will delete all your uploaded items."
        );

        if (confirmDelete && currentUser) {
            const { error } = await supabaseClient.rpc('delete_user_account');

            if (error) {
                console.error("Error deleting account:", error);
                alert("Failed to delete account. Please try again later.");
            } else {
                alert("Your account has been deleted successfully.");
                await supabaseClient.auth.signOut();
                window.location.href = '../index.html';
            }
        }
    });

    initializePage();
</script>
</body>
</html>
</body>
</html>
